services:
  roundcube:
    container_name: roundcube
    image: roundcube/roundcubemail:latest
    restart: unless-stopped
    ports:
      - "8090:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ROUNDCUBEMAIL_DB_TYPE: mysql
      ROUNDCUBEMAIL_DB_HOST: host.docker.internal
      ROUNDCUBEMAIL_DB_PORT: 3307
      ROUNDCUBEMAIL_DB_NAME: roundcube
      ROUNDCUBEMAIL_DB_USER: roundcube
      ROUNDCUBEMAIL_DB_PASSWORD: ${ROUNDCUBEMAIL_DB_PASSWORD}
      ROUNDCUBEMAIL_DEFAULT_HOST: ssl://imap.dominioabsoluto.net
      ROUNDCUBEMAIL_DEFAULT_PORT: 993
      ROUNDCUBEMAIL_SMTP_SERVER: tls://smtp.dominioabsoluto.net
      ROUNDCUBEMAIL_SMTP_PORT: 587
      ROUNDCUBEMAIL_USERNAME_DOMAIN: corrientelebeche.es
      ROUNDCUBEMAIL_SKIN: elastic
      ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE: 25M
      ROUNDCUBEMAIL_DES_KEY: ${ROUNDCUBEMAIL_DES_KEY}
      ROUNDCUBEMAIL_PLUGINS: archive,zipdownload
      ROUNDCUBEMAIL_TEMP_DIR: /var/roundcube/temp
    volumes:
      - ./html:/var/www/html
      - ./config:/var/roundcube/config
      - ./temp:/var/roundcube/temp
